<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0066;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 1. Expert Team / Users -->
  <g id="expert-team" transform="translate(0, 0)">
    <circle cx="50" cy="50" r="45" fill="url(#cyan-grad)" opacity="0.1"/>
    <!-- Main person -->
    <circle cx="50" cy="25" r="12" fill="url(#cyan-grad)"/>
    <rect x="38" y="40" width="24" height="25" fill="url(#cyan-grad)" rx="3"/>
    <!-- Side person 1 -->
    <circle cx="25" cy="65" r="8" fill="url(#cyan-grad)" opacity="0.8"/>
    <rect x="17" y="75" width="16" height="15" fill="url(#cyan-grad)" rx="2" opacity="0.8"/>
    <!-- Side person 2 -->
    <circle cx="75" cy="65" r="8" fill="url(#cyan-grad)" opacity="0.8"/>
    <rect x="67" y="75" width="16" height="15" fill="url(#cyan-grad)" rx="2" opacity="0.8"/>
  </g>

  <!-- 2. Full Service -->
  <g id="full-service" transform="translate(200, 0)">
    <circle cx="50" cy="50" r="45" fill="url(#magenta-grad)" opacity="0.1"/>
    <!-- Center circle -->
    <circle cx="50" cy="50" r="12" fill="url(#magenta-grad)"/>
    <!-- Surrounding circles -->
    <circle cx="30" cy="30" r="10" fill="url(#magenta-grad)" opacity="0.7"/>
    <circle cx="70" cy="30" r="10" fill="url(#magenta-grad)" opacity="0.7"/>
    <circle cx="30" cy="70" r="10" fill="url(#magenta-grad)" opacity="0.7"/>
    <circle cx="70" cy="70" r="10" fill="url(#magenta-grad)" opacity="0.7"/>
    <!-- Connecting lines -->
    <line x1="50" y1="50" x2="30" y2="30" stroke="url(#magenta-grad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="50" x2="70" y2="30" stroke="url(#magenta-grad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="50" x2="30" y2="70" stroke="url(#magenta-grad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="50" x2="70" y2="70" stroke="url(#magenta-grad)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- 3. Technology -->
  <g id="technology" transform="translate(400, 0)">
    <circle cx="50" cy="50" r="45" fill="url(#gold-grad)" opacity="0.1"/>
    <!-- Computer/Device -->
    <rect x="30" y="25" width="40" height="30" fill="none" stroke="url(#gold-grad)" stroke-width="2" rx="2"/>
    <rect x="40" y="30" width="20" height="20" fill="url(#gold-grad)" opacity="0.3"/>
    <!-- Stand -->
    <rect x="40" y="55" width="20" height="8" fill="url(#gold-grad)" rx="1"/>
    <line x1="35" y1="63" x2="65" y2="63" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Signal dots -->
    <circle cx="25" cy="35" r="3" fill="url(#gold-grad)"/>
    <circle cx="75" cy="35" r="3" fill="url(#gold-grad)"/>
  </g>

  <!-- 4. Time / Clock -->
  <g id="time" transform="translate(600, 0)">
    <circle cx="50" cy="50" r="45" fill="url(#cyan-grad)" opacity="0.1"/>
    <!-- Clock circle -->
    <circle cx="50" cy="50" r="20" fill="none" stroke="url(#cyan-grad)" stroke-width="2"/>
    <!-- Numbers -->
    <circle cx="50" cy="32" r="2" fill="url(#cyan-grad)"/>
    <circle cx="68" cy="50" r="2" fill="url(#cyan-grad)"/>
    <circle cx="50" cy="68" r="2" fill="url(#cyan-grad)"/>
    <circle cx="32" cy="50" r="2" fill="url(#cyan-grad)"/>
    <!-- Hour hand -->
    <line x1="50" y1="50" x2="50" y2="42" stroke="url(#cyan-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="50" y1="50" x2="60" y2="50" stroke="url(#cyan-grad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="50" cy="50" r="2.5" fill="url(#cyan-grad)"/>
  </g>

  <!-- Additional icons for About page -->

  <!-- 5. Trophy / Award -->
  <g id="award" transform="translate(0, 200)">
    <circle cx="50" cy="50" r="45" fill="url(#magenta-grad)" opacity="0.1"/>
    <!-- Cup body -->
    <path d="M 35 50 Q 30 40, 35 30 L 65 30 Q 70 40, 65 50 Z" fill="url(#magenta-grad)"/>
    <!-- Cup handles -->
    <path d="M 65 40 Q 80 40, 80 50 Q 80 60, 65 60" fill="none" stroke="url(#magenta-grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Base -->
    <rect x="40" y="50" width="20" height="4" fill="url(#magenta-grad)" rx="1"/>
    <rect x="35" y="54" width="30" height="6" fill="url(#magenta-grad)" rx="2"/>
    <!-- Star -->
    <polygon points="50,20 53,28 61,28 55,33 57,41 50,37 43,41 45,33 39,28 47,28" fill="url(#magenta-grad)" opacity="0.8"/>
  </g>

  <!-- 6. Rocket / Launch -->
  <g id="rocket" transform="translate(200, 200)">
    <circle cx="50" cy="50" r="45" fill="url(#gold-grad)" opacity="0.1"/>
    <!-- Rocket body -->
    <rect x="40" y="20" width="20" height="40" fill="url(#gold-grad)" rx="3"/>
    <!-- Nose cone -->
    <polygon points="50,15 45,20 55,20" fill="url(#gold-grad)"/>
    <!-- Window -->
    <circle cx="50" cy="30" r="5" fill="#0f1419" opacity="0.6"/>
    <!-- Fins -->
    <polygon points="40,55 30,65 35,55" fill="url(#gold-grad)"/>
    <polygon points="60,55 70,65 65,55" fill="url(#gold-grad)"/>
    <!-- Flame -->
    <polygon points="45,60 50,75 55,60" fill="url(#gold-grad)" opacity="0.7"/>
  </g>

  <!-- 7. Target / Bullseye -->
  <g id="target" transform="translate(400, 200)">
    <circle cx="50" cy="50" r="45" fill="url(#cyan-grad)" opacity="0.1"/>
    <!-- Circles -->
    <circle cx="50" cy="50" r="22" fill="none" stroke="url(#cyan-grad)" stroke-width="2"/>
    <circle cx="50" cy="50" r="15" fill="none" stroke="url(#cyan-grad)" stroke-width="2"/>
    <circle cx="50" cy="50" r="8" fill="url(#cyan-grad)"/>
    <!-- Crosshair lines -->
    <line x1="50" y1="25" x2="50" y2="75" stroke="url(#cyan-grad)" stroke-width="1" opacity="0.5"/>
    <line x1="25" y1="50" x2="75" y2="50" stroke="url(#cyan-grad)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 8. Shield / Security -->
  <g id="shield" transform="translate(600, 200)">
    <circle cx="50" cy="50" r="45" fill="url(#magenta-grad)" opacity="0.1"/>
    <!-- Shield shape -->
    <path d="M 50 20 L 70 30 L 70 55 Q 70 70, 50 80 Q 30 70, 30 55 L 30 30 Z" fill="url(#magenta-grad)"/>
    <!-- Check mark -->
    <polyline points="42,55 50,65 65,45" fill="none" stroke="#0f1419" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>