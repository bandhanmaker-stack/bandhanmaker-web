<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0066;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 1. Exhibition -->
  <g id="exhibition" transform="translate(0, 0)">
    <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.2"/>
    <!-- Display boards -->
    <rect x="50" y="40" width="30" height="80" fill="url(#grad1)" rx="4"/>
    <rect x="110" y="30" width="35" height="90" fill="url(#grad1)" rx="4"/>
    <rect x="165" y="50" width="30" height="70" fill="url(#grad1)" rx="4"/>
    <!-- Text lines -->
    <line x1="55" y1="65" x2="75" y2="65" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="85" x2="75" y2="85" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 2. Conference -->
  <g id="conference" transform="translate(240, 0)">
    <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.2"/>
    <!-- Podium -->
    <rect x="70" y="80" width="60" height="50" fill="url(#grad2)" rx="4"/>
    <polygon points="70,80 130,80 125,70 75,70" fill="url(#grad2)"/>
    <!-- Microphone -->
    <circle cx="100" cy="55" r="8" fill="url(#grad2)"/>
    <line x1="100" y1="63" x2="100" y2="75" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
    <!-- Audience indicators -->
    <circle cx="60" cy="140" r="5" fill="url(#grad2)"/>
    <circle cx="85" cy="145" r="5" fill="url(#grad2)"/>
    <circle cx="140" cy="143" r="5" fill="url(#grad2)"/>
  </g>

  <!-- 3. Wedding -->
  <g id="wedding" transform="translate(480, 0)">
    <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.2"/>
    <!-- Heart -->
    <path d="M 100 140 C 85 125, 70 120, 70 105 C 70 92, 80 85, 90 85 C 95 85, 100 88, 100 88 C 100 88, 105 85, 110 85 C 120 85, 130 92, 130 105 C 130 120, 115 125, 100 140 Z"
          fill="url(#grad1)"/>
    <!-- Rings -->
    <circle cx="85" cy="110" r="8" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <circle cx="115" cy="110" r="8" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  </g>

  <!-- 4. Branding -->
  <g id="branding" transform="translate(720, 0)">
    <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.2"/>
    <!-- Logo shape -->
    <circle cx="85" cy="90" r="20" fill="url(#grad2)"/>
    <rect x="105" y="75" width="30" height="30" fill="url(#grad2)" rx="4"/>
    <!-- Lines representing text -->
    <line x1="70" y1="130" x2="130" y2="130" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="145" x2="110" y2="145" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 5. BTL Event -->
  <g id="btl" transform="translate(960, 0)">
    <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.2"/>
    <!-- Target -->
    <circle cx="100" cy="95" r="30" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <circle cx="100" cy="95" r="20" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <circle cx="100" cy="95" r="10" fill="url(#grad1)"/>
    <!-- Arrow -->
    <line x1="50" y1="95" x2="70" y2="95" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="70,95 65,90 65,100" fill="url(#grad1)"/>
  </g>

  <!-- 6. Modeling -->
  <g id="modeling" transform="translate(0, 240)">
    <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.2"/>
    <!-- Head -->
    <circle cx="100" cy="60" r="15" fill="url(#grad2)"/>
    <!-- Body -->
    <rect x="85" y="80" width="30" height="40" fill="url(#grad2)" rx="4"/>
    <!-- Arms -->
    <line x1="85" y1="90" x2="50" y2="85" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="90" x2="150" y2="85" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="90" y1="120" x2="85" y2="145" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="120" x2="115" y2="145" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 7. Wedding Planner -->
  <g id="wedding-planner" transform="translate(240, 240)">
    <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.2"/>
    <!-- Calendar -->
    <rect x="60" y="50" width="80" height="80" fill="none" stroke="url(#grad1)" stroke-width="3" rx="4"/>
    <line x1="60" y1="70" x2="140" y2="70" stroke="url(#grad1)" stroke-width="2"/>
    <!-- Date boxes -->
    <rect x="70" y="80" width="12" height="12" fill="url(#grad1)"/>
    <rect x="90" y="80" width="12" height="12" fill="url(#grad1)"/>
    <rect x="110" y="80" width="12" height="12" fill="url(#grad1)"/>
    <rect x="70" y="100" width="12" height="12" fill="url(#grad1)"/>
    <!-- Checkmark -->
    <polyline points="95,120 100,128 115,110" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 8. Parties -->
  <g id="parties" transform="translate(480, 240)">
    <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.2"/>
    <!-- Balloons -->
    <circle cx="70" cy="50" r="12" fill="url(#grad2)"/>
    <line x1="70" y1="62" x2="70" y2="110" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="45" r="12" fill="url(#grad2)" opacity="0.7"/>
    <line x1="100" y1="57" x2="100" y2="110" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="50" r="12" fill="url(#grad2)"/>
    <line x1="130" y1="62" x2="130" y2="110" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
    <!-- Confetti -->
    <line x1="80" y1="130" x2="85" y2="145" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="130" x2="115" y2="145" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 9. Sound & Light -->
  <g id="sound-light" transform="translate(720, 240)">
    <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.2"/>
    <!-- Speaker cone -->
    <path d="M 70 75 L 80 60 L 80 130 L 70 115 Z" fill="url(#grad1)"/>
    <!-- Sound waves -->
    <path d="M 95 85 Q 105 75, 115 85" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 95 100 Q 110 85, 125 100" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 95 115 Q 105 125, 115 115" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 10. Stage Management -->
  <g id="stage" transform="translate(960, 240)">
    <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.2"/>
    <!-- Stage -->
    <rect x="50" y="110" width="100" height="30" fill="url(#grad2)" rx="4"/>
    <!-- Spotlights -->
    <polygon points="60,70 70,90 50,90" fill="url(#grad2)"/>
    <polygon points="140,70 150,90 130,90" fill="url(#grad2)"/>
    <!-- Light beams -->
    <line x1="65" y1="90" x2="75" y2="110" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <line x1="145" y1="90" x2="125" y2="110" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- 11. Photoshoot -->
  <g id="photoshoot" transform="translate(0, 480)">
    <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.2"/>
    <!-- Camera body -->
    <rect x="60" y="70" width="80" height="50" fill="url(#grad1)" rx="4"/>
    <!-- Lens -->
    <circle cx="100" cy="95" r="20" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <circle cx="100" cy="95" r="12" fill="url(#grad1)" opacity="0.5"/>
    <!-- Flash -->
    <rect x="70" y="55" width="15" height="12" fill="url(#grad1)" rx="2"/>
  </g>

  <!-- 12. Press & Printing -->
  <g id="printing" transform="translate(240, 480)">
    <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.2"/>
    <!-- Paper sheets -->
    <rect x="55" y="65" width="50" height="60" fill="url(#grad2)" rx="2"/>
    <rect x="65" y="60" width="50" height="60" fill="url(#grad2)" opacity="0.7" rx="2"/>
    <rect x="75" y="55" width="50" height="60" fill="url(#grad2)" opacity="0.4" rx="2"/>
    <!-- Text lines -->
    <line x1="80" y1="85" x2="120" y2="85" stroke="#0f1419" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="100" x2="115" y2="100" stroke="#0f1419" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>